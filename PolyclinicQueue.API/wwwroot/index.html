<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поликлиника — вход</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-card" style="max-width:520px">
  <div class="auth-logo"><i class="fa-solid fa-house-medical"></i></div>
  <h1>Управление очередью</h1>
  <p class="muted">Поликлиника MotoSalon</p>

  <div class="auth-tabs">
    <button class="active" data-mode="login">Вход</button>
    <button data-mode="register">Регистрация</button>
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group"><label>Логин</label><input id="loginName" autocomplete="username"></div>
    <div class="form-group"><label>Пароль</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i>Войти</button>
  </form>

  <form id="registerForm" class="hidden" novalidate>
    <div class="form-section"><i class="fa-solid fa-user"></i>Личные данные</div>
    <div class="form-group"><label>ФИО *</label><input id="regName" placeholder="Иванов Иван Иванович"></div>
    <div class="form-row">
      <div class="form-group"><label>Дата рождения *</label><input id="regBirth" type="date"></div>
      <div class="form-group"><label>Пол</label><select id="regGender"><option value="">—</option><option>Мужской</option><option>Женский</option></select></div>
    </div>
    <div class="form-section"><i class="fa-solid fa-address-book"></i>Контакты</div>
    <div class="form-row">
      <div class="form-group"><label>Телефон *</label><input id="regPhone" type="tel" placeholder="+7 (900) 000-00-00"></div>
      <div class="form-group"><label>Email</label><input id="regEmail" type="email"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>№ полиса ОМС</label><input id="regPolicy"></div>
      <div class="form-group"><label>Адрес</label><input id="regAddress"></div>
    </div>
    <div class="form-section"><i class="fa-solid fa-key"></i>Учётная запись</div>
    <div class="form-group"><label>Логин * (минимум 3 символа)</label><input id="regLogin" autocomplete="username"></div>
    <div class="form-row">
      <div class="form-group"><label>Пароль * (минимум 4 символа)</label><input id="regPass" type="password" autocomplete="new-password"></div>
      <div class="form-group"><label>Повторите пароль *</label><input id="regPass2" type="password" autocomplete="new-password"></div>
    </div>
    <button class="btn btn-block" type="submit"><i class="fa-solid fa-user-plus"></i>Зарегистрироваться</button>
  </form>

  <div id="authError" class="alert alert-error hidden"></div>

  <div class="hint">
    <i class="fa-solid fa-circle-info"></i>Тестовые аккаунты:<br>
    admin / admin123 · doctor1 / doc123 (стоматолог) · doctor2 / doc123 (терапевт) · patient1 / pat123
  </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
